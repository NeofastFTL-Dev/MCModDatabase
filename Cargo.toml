[package]
name = "mc-mod-database"
version = "1.0.0"
edition = "2021"
description = "ModDB - search CurseForge and Modrinth mods"
license = "MIT"
authors = ["NeofastFTL"]
build = "build.rs"

[lib]
name = "mc_mod_database"
path = "src/lib.rs"

[[bin]]
name = "ModDB"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.29", default-features = true }
egui = "0.29"
egui_extras = "0.29"
rfd = "0.15"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
